[project]
name = "authshieldlab-backend"
version = "1.0.0"
description = "Enterprise Authentication Security Training Platform – Backend"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # flake8-eradicate
    "PD",   # flake8-pandas
    "PLW",  # pylint warnings
    "PLR",  # pylint refactor
    "PLE",  # pylint errors
    "RUF",  # ruff-specific rules
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit (security)
    "FBT",  # flake8-boolean-trap
    "ICN",  # flake8-import-conventions
    "INP",  # flake8-no-pep420
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SLF",  # flake8-self
    "TRY",  # tryceratops
]
ignore = [
    "ANN101",  # missing type annotation for self (deprecated)
    "ANN102",  # missing type annotation for cls  (deprecated)
    "T201",    # print found – needed for SHA-256 warning
    # Coverage already provided by `mypy --strict` in CI; the strict
    # annotation tier is impractical across the codebase.
    "ANN",
    # Intentional exception chains that read better without `x from y`.
    "B904",
    # FastAPI idiomatic `Depends(...)` / `Query(...)` default arguments.
    "B008",
    # Security-training fixtures legitimately contain example secrets.
    "S105",
    "S106",
    # typer/click-style boolean-flags and datetime helpers.
    "FBT",
    "UP042",
    # The training material contains magic-value comparands by design.
    "PLR2004",
    "PLR0913",
    "PLR0917",
    # Module-level global state is an intentional pattern in the training code.
    "PLW0603",
    # Internal cross-module attribute access is deliberate in this architecture.
    "SLF001",
    # Mutable dataclass defaults where semantics are controlled by design.
    "RUF012",
    # FastAPI/Pydantic schema parameters legitimately shadow builtins
    # (e.g. type, format, id) – renaming changes the API contract.
    "A002",
    # Type-checking import hygiene is cosmetic and unsafe to auto-move here.
    "TCH",
    # tryceratops is a style preference, not a defect class.
    "TRY",
    # Ambiguous-unicode / single-letter-variable lints are cosmetic.
    "RUF001",
    "RUF002",
    "RUF003",
    "E741",
    # Refactor-scale complexity limits without clear defect value.
    "PLR0911",
    "PLR0912",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN"]
# __init__.py aggregation modules intentionally re-export public API
"*/__init__.py" = ["F401"]
# Translation dictionaries keep source strings on one line to ease
# percent-matching and avoid accidental whitespace changes in localizations.
"app/shared/localization/strings.py" = ["E501"]
# Module docstrings are declarative one-line prose; ruff format refuses to
# re-flow them (byte preservation) so line length is enforced by review.
# Module docstrings are declarative one-line prose; ruff format refuses to
# re-flow them (byte preservation) so line length is enforced by review.
"tests/unit/certification/test_certification.py" = ["E501"]
"tests/unit/content_studio/test_course_design.py" = ["E501"]
"tests/unit/ecosystem/test_marketplace.py" = ["E501"]
"tests/unit/optimization/test_optimization.py" = ["E501"]
"tests/unit/production/test_release.py" = ["E501"]
"tests/unit/quality/test_quality.py" = ["E501"]
"tests/unit/simulation/test_dataset_generator.py" = ["E501"]
# Module docstrings are declarative one-line prose; ruff format re-joins them
# regardless of length (byte preservation) so line length is enforced by review.
"app/collaboration/services/package_validation_service.py" = ["E501"]
"app/collaboration/services/peer_review_service.py" = ["E501"]
"app/developer/services/developer_tools_service.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "passlib.*",
    "argon2.*",
    "jose.*",
    "structlog.*",
    "plotly.*",
    "pandas.*",
    "reportlab.*",
    "weasyprint.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
